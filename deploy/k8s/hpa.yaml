# Fase 2 (con PostgreSQL y caché compartida): escalar por CPU. Agregar a kustomization.yaml.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pyme-agent-guard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pyme-agent-guard
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
